      <path d="M-80 -8 L-94 -102 L94 -102 L80 -8 Z" fill="#0f1a2c"/>
      <path d="M-73 -14 L-86 -96 L86 -96 L73 -14 Z" fill="#b5843a"/>
      <rect x="-56" y="-78" width="112" height="9" rx="2" fill="#f1ece0" opacity="0.85"/>
