    <rect x="70" y="338" width="460" height="8" fill="#6d4c1e"/>
    <rect x="108" y="346" width="14" height="42" fill="#6d4c1e"/>
    <rect x="478" y="346" width="14" height="42" fill="#6d4c1e"/>

    <!-- chair back -->
