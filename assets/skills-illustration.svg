<svg viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="frame"><rect x="0" y="0" width="600" height="420"/></clipPath>
